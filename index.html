<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>DOMINO FILTRADO</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DOMINO FILTRADO" />
  <style>
    :root{
      --bg:#f4f5f7;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;
      --accent:#111827;--accent2:#374151;--ok:#0f766e;--bad:#b91c1c;--gold:#b7791f;--soft:#eef2f7;
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    header{position:sticky;top:0;z-index:20;background:rgba(17,24,39,.97);color:#fff;padding:14px 16px 12px;box-shadow:0 2px 10px rgba(0,0,0,.14)}
    .head{max-width:820px;margin:auto;display:flex;align-items:center;gap:12px}
    .tile{width:42px;height:42px;border:2px solid #fff;border-radius:9px;display:grid;place-items:center;font-size:24px;transform:rotate(8deg)}
    h1{font-size:20px;margin:0;letter-spacing:.7px}.sub{font-size:12px;opacity:.75;margin-top:3px}
    main{max-width:820px;margin:auto;padding:14px 14px 90px}
    .tabs{position:fixed;bottom:0;left:0;right:0;z-index:25;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:7px max(7px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(7px,env(safe-area-inset-left));box-shadow:0 -3px 15px rgba(0,0,0,.08)}
    .tab{border:0;background:transparent;padding:7px 2px;color:var(--muted);font-weight:700;font-size:11px}.tab.active{color:var(--text)}
    .tab span{display:block;font-size:21px;margin-bottom:2px}
    .view{display:none}.view.active{display:block}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:13px;box-shadow:0 2px 8px rgba(17,24,39,.04)}
    .card h2,.card h3{margin:0 0 10px}.card h2{font-size:20px}.card h3{font-size:16px}.muted{color:var(--muted)}
    .btn{border:0;border-radius:13px;padding:13px 15px;font-size:15px;font-weight:800;cursor:pointer}.btn.primary{background:var(--accent);color:#fff}.btn.secondary{background:var(--soft);color:var(--text)}.btn.danger{background:#fee2e2;color:var(--bad)}.btn.ok{background:#ccfbf1;color:#115e59}.btn:disabled{opacity:.4;cursor:not-allowed}
    .full{width:100%}.row{display:flex;gap:9px;align-items:center}.wrap{flex-wrap:wrap}.grow{flex:1}.space{justify-content:space-between}
    label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:9px 0 5px;text-transform:uppercase;letter-spacing:.4px}
    input,select{width:100%;padding:12px 11px;border:1px solid #d1d5db;border-radius:12px;background:#fff;font-size:16px;color:var(--text)}
    .team-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.team{padding:13px;border-radius:16px;background:#f9fafb;border:1px solid var(--line)}.team-title{font-size:13px;font-weight:900;letter-spacing:.7px;margin-bottom:8px}.vs{text-align:center;font-weight:900;color:var(--muted);padding:4px}
    .scoreboard{display:grid;grid-template-columns:1fr 1fr;gap:10px}.score-panel{background:#fff;border:2px solid #111827;border-radius:18px;padding:14px;text-align:center}.score-label{font-size:12px;font-weight:900;letter-spacing:.7px}.score-names{font-size:13px;color:var(--muted);min-height:34px;margin:7px 0}.score{font-size:58px;font-weight:900;line-height:1}.score-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}.score-buttons button{padding:10px 3px;border:0;border-radius:10px;background:#eef2f7;font-weight:900;font-size:15px}.custom{display:flex;gap:6px;margin-top:8px}.custom input{padding:9px;text-align:center}.custom button{white-space:nowrap}
    .friendly{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:13px;padding:10px 12px;font-weight:800;font-size:13px;margin:10px 0}
    .official{background:#ecfdf5;color:#065f46;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:900}.guest{background:#fff7ed;color:#9a3412;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:900}.inactive{opacity:.55}
    .player{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}.player:last-child{border-bottom:0}.initial{width:38px;height:38px;background:#111827;color:#fff;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:12px}.pname{font-weight:800}.pmeta{font-size:12px;color:var(--muted);margin-top:2px}
    table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#fff}.pos{color:var(--ok);font-weight:900}.neg{color:var(--bad);font-weight:900}.zero{color:var(--muted)}
    .scroll{overflow-x:auto;border:1px solid var(--line);border-radius:13px}.scroll table{min-width:560px}
    .stat{display:grid;grid-template-columns:1fr auto;gap:7px;padding:8px 0;border-bottom:1px solid var(--line)}.stat:last-child{border-bottom:0}.bigsum{font-size:30px;font-weight:900}.tiny{font-size:11px;color:var(--muted)}
    .game-line{padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}.game-line:last-child{border-bottom:0}.game-head{display:flex;justify-content:space-between;font-weight:800;gap:8px}.ray{font-size:12px;margin-top:4px;color:var(--muted)}
    .toast{position:fixed;left:50%;bottom:85px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 16px;border-radius:999px;font-weight:800;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:40}.toast.show{opacity:1}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.46);z-index:50;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:820px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}.sheet h2{margin:0 0 10px}
    .empty{text-align:center;padding:28px 10px;color:var(--muted)}
    .pill{display:inline-flex;gap:6px;align-items:center;background:#eef2f7;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:800}
    @media(min-width:700px){.tabs{left:50%;transform:translateX(-50%);max-width:820px;border:1px solid var(--line);border-radius:18px 18px 0 0}.score-buttons{grid-template-columns:repeat(5,1fr)}.sheet{border-radius:24px;margin-bottom:20px}}
  </style>
</head>
<body>
<header><div class="head"><div class="tile">⚄</div><div><h1>DOMINO FILTRADO</h1><div class="sub">Anotador y campeonato</div></div></div></header>
<main>
  <section id="view-home" class="view active"></section>
  <section id="view-game" class="view"></section>
  <section id="view-history" class="view"></section>
  <section id="view-players" class="view"></section>
</main>
<nav class="tabs">
  <button class="tab active" data-view="home"><span>⌂</span>Noche</button>
  <button class="tab" data-view="game"><span>⚄</span>Partida</button>
  <button class="tab" data-view="history"><span>▦</span>Historial</button>
  <button class="tab" data-view="players"><span>♟</span>Jugadores</button>
</nav>
<div id="toast" class="toast"></div>
<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div>
<script>
const KEY='dominoFiltrado_v1';
const seed={
  players:[
    {id:'tm',name:'Toño Márquez',initials:'TM',type:'official',active:true},
    {id:'a',name:'Alejandro Ortega',initials:'A',type:'official',active:true},
    {id:'d',name:'David Gómez Junco',initials:'D',type:'official',active:true},
    {id:'g',name:'Gila',initials:'G',type:'official',active:true},
    {id:'p',name:'Pollo',initials:'P',type:'official',active:true}
  ],
  nights:[], currentNight:null, currentGame:null
};
let db=load();
function load(){try{return {...seed,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return structuredClone(seed)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function todayISO(){return new Date().toISOString().slice(0,10)}
function fmtDate(s){if(!s)return'';return new Date(s+'T12:00:00').toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'})}
function player(id){return db.players.find(p=>p.id===id)}
function initials(id){return player(id)?.initials||'?'}
function name(id){return player(id)?.name||'Jugador'}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900)}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function scoreClass(n){return n>0?'pos':n<0?'neg':'zero'}
function signed(n){return n>0?'+'+n:String(n)}
function currentNight(){return db.currentNight ? db.nights.find(n=>n.id===db.currentNight) : null}
function nightTotals(n){const out={};db.players.filter(p=>p.type==='official').forEach(p=>out[p.id]=0);n.games.forEach(g=>{if(g.friendly)return;Object.entries(g.rays||{}).forEach(([id,v])=>out[id]=(out[id]||0)+v)});return out}
function allTotals(){const out={};db.players.filter(p=>p.type==='official').forEach(p=>out[p.id]=0);db.nights.filter(n=>n.closed).forEach(n=>{const t=nightTotals(n);Object.entries(t).forEach(([id,v])=>out[id]=(out[id]||0)+v)});return out}
function activePlayers(){return db.players.filter(p=>p.active)}
function friendlyIds(ids){return ids.some(id=>player(id)?.type==='guest')}
function render(){renderHome();renderGame();renderHistory();renderPlayers();save()}
function renderHome(){const el=document.getElementById('view-home'),n=currentNight();
  if(!n){el.innerHTML=`<div class="card"><h2>Nueva noche de dominó</h2><p class="muted">Abre una jornada para empezar a registrar partidas y rayas.</p><label>Fecha</label><input id="nightDate" type="date" value="${todayISO()}"><div style="height:10px"></div><button class="btn primary full" onclick="startNight()">▶ Iniciar noche</button></div><div class="card"><h3>Reglas automáticas</h3><div class="stat"><span>Perdedor termina en 0</span><b>3 rayas</b></div><div class="stat"><span>Perdedor termina de 1 a 49</span><b>2 rayas</b></div><div class="stat"><span>Perdedor termina con 50 o más</span><b>1 raya</b></div><div class="friendly">Si participa un jugador invitado, la partida es amistosa y no suma ni resta rayas a nadie.</div></div>`;return}
  const totals=nightTotals(n); const officials=db.players.filter(p=>p.type==='official'&&p.active);
  el.innerHTML=`<div class="card"><div class="row space"><div><div class="tiny">NOCHE ABIERTA</div><h2>${fmtDate(n.date)}</h2></div><span class="pill">${n.games.length} partida${n.games.length!==1?'s':''}</span></div><button class="btn primary full" onclick="goView('game')">${db.currentGame?'Continuar partida':'Nueva partida'}</button></div>
  <div class="card"><h3>Cuenta de la noche</h3>${officials.map(p=>`<div class="stat"><span><b>${esc(p.initials)}</b> · ${esc(p.name)}</span><span class="${scoreClass(totals[p.id]||0)}">${signed(totals[p.id]||0)}</span></div>`).join('')||'<div class="empty">Sin jugadores oficiales activos.</div>'}</div>
  <div class="card"><div class="row space"><h3>Partidas jugadas</h3>${n.games.length?`<button class="btn secondary" onclick="showGames()">Ver detalle</button>`:''}</div>${n.games.length? n.games.slice(-3).reverse().map(gameLine).join(''):'<div class="empty">Todavía no hay partidas registradas.</div>'}</div>
  <button class="btn danger full" onclick="closeNight()">Cerrar noche</button>`;
}
function startNight(){const d=document.getElementById('nightDate').value||todayISO(); const n={id:uid(),date:d,createdAt:Date.now(),closed:false,games:[]};db.nights.push(n);db.currentNight=n.id;db.currentGame=null;render();goView('game')}
function closeNight(){const n=currentNight();if(!n)return;if(db.currentGame){alert('Primero termina o cancela la partida actual.');return} if(!confirm('¿Cerrar la noche y pasar sus resultados al historial?'))return;n.closed=true;n.closedAt=Date.now();db.currentNight=null;render();goView('history');toast('Noche guardada')}
function gameLine(g,i){const a=g.teams.us.map(initials).join('+'),b=g.teams.them.map(initials).join('+');const tag=g.friendly?'Amistosa':`${g.rayValue} raya${g.rayValue!==1?'s':''}`;return `<div class="game-line"><div class="game-head"><span>${a} vs ${b}</span><span>${g.score.us}–${g.score.them}</span></div><div class="ray">${tag}</div></div>`}

function renderGame(){const el=document.getElementById('view-game'),n=currentNight();if(!n){el.innerHTML=`<div class="card"><div class="empty">Primero inicia una noche desde la pestaña <b>Noche</b>.</div><button class="btn primary full" onclick="goView('home')">Ir a Noche</button></div>`;return}
  if(!db.currentGame){const ps=activePlayers(); const opts=`<option value="">Selecciona...</option>`+ps.map(p=>`<option value="${p.id}">${esc(p.initials)} · ${esc(p.name)}${p.type==='guest'?' (Invitado)':''}</option>`).join('');
    el.innerHTML=`<div class="card"><h2>Configurar partida</h2><p class="muted">Elige libremente quién juega y las parejas. La app no hace rotación automática.</p><div class="team-grid"><div class="team"><div class="team-title">NOSOTROS</div><select id="us1">${opts}</select><div style="height:7px"></div><select id="us2">${opts}</select></div><div class="team"><div class="team-title">ELLOS</div><select id="th1">${opts}</select><div style="height:7px"></div><select id="th2">${opts}</select></div></div><div id="guestNotice"></div><div style="height:12px"></div><button class="btn primary full" onclick="beginGame()">⚄ Iniciar partida</button></div><div class="card"><button class="btn secondary full" onclick="quickGuest()">＋ Agregar invitado rápido</button></div>`;
    ['us1','us2','th1','th2'].forEach(id=>document.getElementById(id).addEventListener('change',previewFriendly));return}
  const g=db.currentGame;const fn=g.friendly?`<div class="friendly">PARTIDA AMISTOSA · Hay invitado en mesa. El marcador sí cuenta, pero esta partida no genera rayas para nadie.</div>`:'';
  el.innerHTML=`<div class="card"><div class="row space"><div><div class="tiny">PARTIDA EN CURSO</div><h2>Marcador a 100</h2></div><button class="btn danger" onclick="cancelGame()">Cancelar</button></div>${fn}<div class="scoreboard"><div class="score-panel"><div class="score-label">NOSOTROS</div><div class="score-names">${g.teams.us.map(id=>esc(name(id))).join('<br>')}</div><div class="score">${g.score.us}</div>${scoreControls('us')}</div><div class="score-panel"><div class="score-label">ELLOS</div><div class="score-names">${g.teams.them.map(id=>esc(name(id))).join('<br>')}</div><div class="score">${g.score.them}</div>${scoreControls('them')}</div></div><div style="height:10px"></div><div class="row"><button class="btn secondary grow" onclick="undoScore()">↶ Deshacer</button><button class="btn primary grow" ${Math.max(g.score.us,g.score.them)<100?'disabled':''} onclick="finishGame()">Terminar partida</button></div></div>`;
}
function scoreControls(side){return `<div class="score-buttons">${[1,2,5,10,20].map(v=>`<button onclick="addScore('${side}',${v})">+${v}</button>`).join('')}</div><div class="custom"><input id="custom-${side}" type="number" inputmode="numeric" min="1" placeholder="Puntos"><button class="btn secondary" onclick="addCustom('${side}')">Sumar</button></div>`}
function previewFriendly(){const ids=['us1','us2','th1','th2'].map(id=>document.getElementById(id).value).filter(Boolean);document.getElementById('guestNotice').innerHTML=friendlyIds(ids)?'<div class="friendly">Hay un invitado seleccionado: esta partida será amistosa y no generará rayas.</div>':''}
function beginGame(){const ids=['us1','us2','th1','th2'].map(id=>document.getElementById(id).value);if(ids.some(x=>!x)){alert('Selecciona los cuatro jugadores.');return}if(new Set(ids).size<4){alert('No puedes seleccionar al mismo jugador dos veces.');return}db.currentGame={id:uid(),teams:{us:ids.slice(0,2),them:ids.slice(2)},score:{us:0,them:0},friendly:friendlyIds(ids),history:[],startedAt:Date.now()};render()}
function addScore(side,v){const g=db.currentGame;if(!g)return;g.history.push({side,prev:g.score[side]});g.score[side]+=v;render()}
function addCustom(side){const inp=document.getElementById('custom-'+side),v=parseInt(inp.value,10);if(!v||v<1)return;addScore(side,v)}
function undoScore(){const g=db.currentGame;if(!g||!g.history.length){toast('No hay anotación para deshacer');return}const h=g.history.pop();g.score[h.side]=h.prev;render()}
function cancelGame(){if(confirm('¿Cancelar esta partida? No se guardará.')){db.currentGame=null;render()}}
function finishGame(){const g=db.currentGame,n=currentNight();if(!g||!n)return;if(Math.max(g.score.us,g.score.them)<100){alert('La partida todavía no llega a 100 puntos.');return}if(g.score.us===g.score.them){alert('El marcador está empatado. Corrige el resultado antes de terminar.');return}const winner=g.score.us>g.score.them?'us':'them',loser=winner==='us'?'them':'us',loserScore=g.score[loser];let rayValue=loserScore===0?3:loserScore<=49?2:1;let rays={};if(!g.friendly){g.teams[winner].forEach(id=>{if(player(id)?.type==='official')rays[id]=rayValue});g.teams[loser].forEach(id=>{if(player(id)?.type==='official')rays[id]=-rayValue})}const rec={id:g.id,teams:g.teams,score:g.score,friendly:g.friendly,rayValue:g.friendly?0:rayValue,rays,winner,finishedAt:Date.now()};n.games.push(rec);db.currentGame=null;render();toast(g.friendly?'Partida amistosa guardada':`Resultado: ${rayValue} raya${rayValue!==1?'s':''}`)}
function quickGuest(){openPlayerModal('guest')}

function renderHistory(){const el=document.getElementById('view-history');const closed=db.nights.filter(n=>n.closed).sort((a,b)=>b.date.localeCompare(a.date));const offs=db.players.filter(p=>p.type==='official');const totals=allTotals();const rank=[...offs].sort((a,b)=>(totals[b.id]||0)-(totals[a.id]||0));
  let table='';if(closed.length){table=`<div class="scroll"><table><thead><tr><th>Fecha</th>${offs.map(p=>`<th>${esc(p.initials)}</th>`).join('')}</tr></thead><tbody>${closed.map(n=>{const t=nightTotals(n);return `<tr><td>${fmtDate(n.date)}</td>${offs.map(p=>`<td class="${scoreClass(t[p.id]||0)}">${(t[p.id]||0)===0?'—':signed(t[p.id]||0)}</td>`).join('')}</tr>`}).join('')}<tr><th>TOTAL</th>${offs.map(p=>`<th class="${scoreClass(totals[p.id]||0)}">${signed(totals[p.id]||0)}</th>`).join('')}</tr></tbody></table></div>`}
  el.innerHTML=`<div class="card"><h2>Posiciones</h2>${rank.length?rank.map((p,i)=>`<div class="stat"><span><b>${i+1}.</b> ${esc(p.name)}</span><span class="${scoreClass(totals[p.id]||0)} bigsum" style="font-size:20px">${signed(totals[p.id]||0)}</span></div>`).join(''):'<div class="empty">Sin jugadores.</div>'}</div><div class="card"><h2>Libreta histórica</h2>${table||'<div class="empty">Todavía no hay noches cerradas.</div>'}</div><div class="card"><h3>Respaldo</h3><p class="muted">Los datos se guardan en este navegador. Puedes descargar un respaldo y restaurarlo después.</p><div class="row"><button class="btn secondary grow" onclick="exportData()">Exportar</button><button class="btn secondary grow" onclick="document.getElementById('importFile').click()">Importar</button></div><input id="importFile" type="file" accept="application/json" style="display:none" onchange="importData(event)"></div>`;
}
function showGames(){const n=currentNight();if(!n)return;document.getElementById('sheet').innerHTML=`<div class="row space"><h2>Detalle de la noche</h2><button class="btn secondary" onclick="closeModal()">Cerrar</button></div>${n.games.map((g,i)=>`<div class="game-line"><div class="game-head"><span>#${i+1} · ${g.teams.us.map(initials).join('+')} vs ${g.teams.them.map(initials).join('+')}</span><span>${g.score.us}–${g.score.them}</span></div><div class="ray">${g.friendly?'Amistosa · sin rayas':Object.entries(g.rays).map(([id,v])=>`${initials(id)} ${signed(v)}`).join(' · ')}</div></div>`).join('')}<div style="height:12px"></div><button class="btn danger full" onclick="deleteLastGame()">Eliminar última partida</button>`;document.getElementById('modal').classList.add('show')}
function deleteLastGame(){const n=currentNight();if(!n?.games.length)return;if(confirm('¿Eliminar la última partida registrada de esta noche?')){n.games.pop();closeModal();render();toast('Última partida eliminada')}}
function closeModal(){document.getElementById('modal').classList.remove('show')}

function renderPlayers(){const el=document.getElementById('view-players');el.innerHTML=`<div class="card"><div class="row space"><div><h2>Jugadores</h2><p class="muted" style="margin:2px 0 0">Oficiales e invitados.</p></div><button class="btn primary" onclick="openPlayerModal('official')">＋ Agregar</button></div>${db.players.map(p=>`<div class="player ${p.active?'':'inactive'}"><div class="row grow"><div class="initial">${esc(p.initials)}</div><div><div class="pname">${esc(p.name)}</div><div class="pmeta"><span class="${p.type==='guest'?'guest':'official'}">${p.type==='guest'?'INVITADO':'OFICIAL'}</span> ${p.active?'':' · Inactivo'}</div></div></div><button class="btn secondary" onclick="editPlayer('${p.id}')">Editar</button></div>`).join('')}</div><div class="card"><button class="btn secondary full" onclick="openPlayerModal('guest')">＋ Agregar jugador invitado</button></div>`}
function openPlayerModal(type='official',existing=null){const p=existing?player(existing):null;document.getElementById('sheet').innerHTML=`<h2>${p?'Editar jugador':type==='guest'?'Nuevo invitado':'Nuevo jugador'}</h2><label>Nombre</label><input id="pName" value="${p?esc(p.name):''}" placeholder="Nombre"><label>Iniciales</label><input id="pInit" maxlength="4" value="${p?esc(p.initials):''}" placeholder="Ej. RM"><label>Tipo</label><select id="pType"><option value="official" ${(p?.type||type)==='official'?'selected':''}>Jugador oficial</option><option value="guest" ${(p?.type||type)==='guest'?'selected':''}>Jugador invitado</option></select>${p?`<label>Estado</label><select id="pActive"><option value="1" ${p.active?'selected':''}>Activo</option><option value="0" ${!p.active?'selected':''}>Inactivo</option></select>`:''}<div style="height:14px"></div><button class="btn primary full" onclick="savePlayer('${p?.id||''}')">Guardar</button><div style="height:8px"></div><button class="btn secondary full" onclick="closeModal()">Cancelar</button>`;document.getElementById('modal').classList.add('show')}
function editPlayer(id){openPlayerModal('official',id)}
function savePlayer(id){const nm=document.getElementById('pName').value.trim(),it=document.getElementById('pInit').value.trim().toUpperCase(),type=document.getElementById('pType').value;if(!nm||!it){alert('Escribe nombre e iniciales.');return}if(id){const p=player(id);p.name=nm;p.initials=it;p.type=type;p.active=document.getElementById('pActive').value==='1'}else db.players.push({id:uid(),name:nm,initials:it,type,active:true});closeModal();render();toast('Jugador guardado')}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='domino_filtrado_respaldo_'+todayISO()+'.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.players||!x.nights)throw new Error();if(confirm('Esto reemplazará los datos actuales. ¿Continuar?')){db=x;save();render();toast('Respaldo restaurado')}}catch(err){alert('El archivo no parece ser un respaldo válido de DOMINO FILTRADO.')}};r.readAsText(f)}
function goView(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById('view-'+v).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.view===v));window.scrollTo(0,0)}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>goView(b.dataset.view)));
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
render();
</script>
</body>
</html>
